<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Campus de Solara Field School: tus cursos, tus clases y tu progreso.">
    <title>Campus | Solara Field School</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./ui.css">
    <link rel="stylesheet" href="./campus.css">
    <script type="module" src="./campus.js"></script>
    <script type="module" src="./app.js"></script>
</head>
<body class="ui campus-ui">
    <a class="skip" href="#campus-main" data-en="Skip to content">Ir al contenido</a>
    <div class="campus-shell">
        <!-- Barra lateral del campus: navegación propia, distinta del sitio público. -->
        <aside class="campus-side" id="campus-side" aria-label="Campus">
            <a class="campus-brand" href="#inicio"><span class="brand-mark" aria-hidden="true">✳</span><span>Solara<small>CAMPUS</small></span></a>
            <nav class="campus-nav" aria-label="Campus" id="campus-nav">
                <a href="#inicio" data-view="inicio"><span class="campus-icon" aria-hidden="true">⌂</span><span data-en="Home">Inicio</span></a>
                <a href="#cursos" data-view="cursos"><span class="campus-icon" aria-hidden="true">▤</span><span data-en="My courses">Mis cursos</span></a>
                <a href="#certificados" data-view="certificados"><span class="campus-icon" aria-hidden="true">◎</span><span data-en="Certificates">Certificados</span></a>
                <a href="#notas" data-view="notas"><span class="campus-icon" aria-hidden="true">✎</span><span data-en="My notes">Mis notas</span></a>
            </nav>
            <div class="campus-side-courses">
                <p class="campus-side-label" data-en="Keep learning">Sigue aprendiendo</p>
                <ul id="campus-side-courses"></ul>
            </div>
            <div class="campus-side-foot">
                <a href="./mi-cuenta.html" data-en="Account and payments">Cuenta y pagos</a>
                <a href="./catalogo.html" data-en="Browse the catalog">Explorar el catálogo</a>
                <a href="./" data-en="Back to the website">Volver al sitio</a>
                <div class="campus-side-row">
                    <label class="sr-only" for="language" data-en="Language">Idioma</label>
                    <select id="language"><option value="es" lang="es">Español</option><option value="en" lang="en">English</option></select>
                    <button class="campus-logout" id="campus-logout" type="button" data-en="Sign out">Cerrar sesión</button>
                </div>
            </div>
        </aside>
        <div class="campus-backdrop" id="campus-backdrop" hidden></div>

        <div class="campus-body">
            <header class="campus-top">
                <button class="campus-menu-btn" id="campus-menu" type="button" aria-controls="campus-side" aria-expanded="false" data-en="Menu">Menú</button>
                <form class="campus-search" id="campus-search" role="search">
                    <label class="sr-only" for="campus-q" data-en="Search my lessons">Buscar en mis clases</label>
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <input id="campus-q" type="search" autocomplete="off" placeholder="Buscar en mis cursos y clases" data-en-placeholder="Search my courses and lessons" aria-controls="campus-results">
                    <div class="campus-results" id="campus-results" hidden></div>
                </form>
                <div class="campus-user" id="campus-user"></div>
            </header>
            <main class="campus-main" id="campus-main" tabindex="-1"></main>
        </div>
    </div>
    <noscript data-en="Enable JavaScript to use the campus.">Activa JavaScript para usar el campus.</noscript>

    <dialog class="certificate-dialog" id="certificate-dialog" aria-labelledby="certificate-dialog-title">
        <div class="section-dialog-head">
            <h2 id="certificate-dialog-title" data-en="Certificate of completion">Certificado de finalización</h2>
            <button class="icon-btn" id="certificate-close" type="button" aria-label="Cerrar" data-en-label="Close">✕</button>
        </div>
        <div class="certificate-body" id="certificate-body"></div>
    </dialog>
</body>
</html>
