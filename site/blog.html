<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Guías y artículos de Solara Field School sobre educación al aire libre.">
    <title>Blog | Solara Field School</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
</head>
<body class="editorial-page">
    <a class="skip" href="#main" data-en="Skip to content">Ir al contenido</a>
    <header class="top">
        <div class="wrap nav">
            <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">✳</span><span>Solara<small>FIELD SCHOOL</small></span></a>
            <button class="button outline mobile-menu" id="navigation-toggle" type="button" aria-controls="main-navigation" aria-expanded="false" data-en="Menu">Menú</button>
            <nav id="main-navigation" aria-label="Principal" data-en-label="Main navigation">
                <a href="./catalogo.html" data-en="Courses">Cursos</a><a href="./escuelas.html" data-en="Schools">Escuelas</a>
                <a href="./programas.html" data-en="Programs">Programas</a><a href="./publico.html" data-en="Who it’s for">Público</a>
                <a href="./blog.html" aria-current="page" data-en="Blog">Blog</a><a href="./precios.html" data-en="Pricing">Precios</a>
                <a href="./contacto.html" data-en="Contact">Contacto</a>
            </nav>
            <div class="nav-actions"><a class="button outline quick-search" href="./catalogo.html#cursos" data-en="Search">Buscar</a><label class="sr-only" for="language" data-en="Language">Idioma</label><select id="language"><option value="es" lang="es">Español</option><option value="en" lang="en">English</option></select><button class="button outline" id="open-cart" type="button"><span data-en="Cart">Carrito</span> <span id="cart-count">0</span></button></div>
        </div>
    </header>
    <main class="wrap info-section editorial-index" id="main">
        <p class="eyebrow green" data-en="FIELD JOURNAL">BITÁCORA DE CAMPO</p>
        <h1 data-en="The latest from Solara">Lo último del blog de Solara</h1>
        <div id="blog-featured"></div>
        <section aria-labelledby="articles-title" id="articulos">
            <div class="section-heading">
                <h2 id="articles-title" data-en="Articles">Artículos</h2>
                <div class="filters editorial-filters">
                    <label for="blog-search"><span data-en="Search articles">Buscar artículos</span>
                        <input id="blog-search" type="search" placeholder="Ej. cuaderno" data-en-placeholder="e.g. notebook"></label>
                    <label for="blog-topic"><span data-en="Topic">Tema</span>
                        <select id="blog-topic"><option value="" data-en="All topics">Todos los temas</option><option value="campo" data-en="Fieldwork">Trabajo de campo</option><option value="biodiversidad" data-en="Biodiversity">Biodiversidad</option><option value="educacion" data-en="Education">Educación</option></select>
                    </label>
                </div>
            </div>
            <p class="muted" id="blog-results" role="status"></p>
            <div class="editorial-grid" id="blog-posts"></div>
            <noscript>Activa JavaScript para leer los artículos y usar los filtros.</noscript>
        </section>
    </main>
    <footer class="wrap footer">
        <span>Solara Field School</span>
        <nav class="footer-nav" aria-label="Enlaces del sitio" data-en-label="Site links">
            <a href="./catalogo.html" data-en="Course catalog">Catálogo de cursos</a><a href="./escuelas.html" data-en="Schools">Escuelas</a><a href="./blog.html">Blog</a><a href="./programas.html" data-en="Programs">Programas</a>
            <a href="./contacto.html#preguntas" data-en="Help">Ayuda</a><a href="./contacto.html" data-en="Contact">Contacto</a>
        </nav>
    </footer>

    <dialog class="cart-dialog" id="cart-dialog" aria-labelledby="cart-title">
        <div class="dialog-heading"><h2 id="cart-title" data-en="Your cart">Tu carrito</h2><form method="dialog"><button class="button outline" aria-label="Cerrar carrito" data-en-label="Close cart" data-en="Close">Cerrar</button></form></div>
        <p class="muted" data-en="Demo checkout. You will not be charged.">Compra de demostración. No se enviará ningún cobro.</p>
        <div id="cart-items"></div>
        <div class="dialog-footer"><strong id="cart-total"></strong><button class="button dark" id="checkout" type="button" data-en="Simulate purchase">Simular compra</button></div>
        <p id="checkout-status" class="muted" role="status"></p>
    </dialog>
</body>
</html>
